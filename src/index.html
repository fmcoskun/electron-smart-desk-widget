<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com"
  />
  <title>Smart Desk & Office IoT Controller</title>

  <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css"
  />

  <style>
    :root {
      --bg: #e8e8e8;
      --text: #2c3036;
      --text-muted: #757d8a;
      --shadow-light: rgba(255, 255, 255, 0.85);
      --shadow-dark: rgba(0, 0, 0, 0.16);
      --shadow-dark-deep: rgba(0, 0, 0, 0.24);
      --accent-green: #00b33c;
      --accent-green-glow: rgba(0, 179, 60, 0.45);
      --accent-red: #e63946;
      --card-radius: 18px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      background: transparent;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
      color: var(--text);
      padding: 24px;
    }

    /* Outer Desktop Window Simulator (Electron Frameless Shell) */
    .widget-window {
      width: 410px;
      background: var(--bg);
      border-radius: 28px;
      padding: 16px 20px 20px;
      /* Original neumorphic shadow - white glow looks like a halo on dark desktops
      box-shadow:
        18px 18px 35px rgba(0, 0, 0, 0.22),
        -14px -14px 28px rgba(255, 255, 255, 0.9);
      */
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.3s ease;
    }

    /* Electron Window Bar */
    .window-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px 10px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      cursor: grab;
      -webkit-app-region: drag;
    }

    .window-controls,
    .window-controls * {
      -webkit-app-region: no-drag;
    }

    .window-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mqtt-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-green);
      background: rgba(0, 179, 60, 0.12);
      padding: 2px 8px;
      border-radius: 12px;
      box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.08);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .window-controls {
      display: flex;
      gap: 8px;
    }

    .win-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      outline: none;
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      box-shadow: 
        -3px -3px 6px var(--shadow-light),
        3px 3px 6px var(--shadow-dark);
      transition: all 0.2s ease;
    }

    .win-btn:active {
      box-shadow: 
        inset -2px -2px 4px var(--shadow-light),
        inset 2px 2px 4px var(--shadow-dark);
    }

    .win-btn.close:hover {
      color: var(--accent-red);
    }

    /* Quick Preset Scenes */
    .scenes-container {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .scene-chip {
      flex: 1;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      background: var(--bg);
      color: var(--text);
      box-shadow: 
        -4px -4px 8px var(--shadow-light),
        4px 4px 8px var(--shadow-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .scene-chip i {
      font-size: 13px;
    }

    .scene-chip.active {
      color: #007f2b;
      box-shadow: 
        inset 3px 3px 6px var(--shadow-dark-deep),
        inset -3px -3px 6px var(--shadow-light);
      font-weight: 600;
    }

    /* Core Neumorphic Switch Container - Exact style from reference */
    .switch-holder {
      display: flex;
      padding: 10px 18px;
      border-radius: var(--card-radius);
      box-shadow: 
        -8px -8px 15px rgba(255, 255, 255, 0.7),
        10px 10px 10px rgba(0, 0, 0, 0.2),
        inset 8px 8px 15px rgba(255, 255, 255, 0.7),
        inset 10px 10px 10px rgba(0, 0, 0, 0.2);
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
      background: var(--bg);
    }

    .switch-holder.expanded {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }

    .switch-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .switch-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
    }

    .icon-box {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 
        -3px -3px 6px var(--shadow-light),
        3px 3px 6px var(--shadow-dark);
      color: #3b414d;
      transition: all 0.25s;
    }

    .switch-holder.is-on .icon-box {
      color: var(--accent-green);
      box-shadow: 
        inset -2px -2px 4px var(--shadow-light),
        inset 2px 2px 4px var(--shadow-dark);
    }

    .switch-info {
      display: flex;
      flex-direction: column;
    }

    .switch-subtext {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Switch toggle slider - Reference implementation */
    .switch-toggle {
      height: 40px;
    }

    .switch-toggle input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      z-index: -2;
      pointer-events: none;
    }

    .switch-toggle input[type="checkbox"] + label {
      position: relative;
      display: inline-block;
      width: 96px;
      height: 38px;
      border-radius: 20px;
      margin: 0;
      cursor: pointer;
      box-shadow: 
        inset -8px -8px 15px rgba(255, 255, 255, 0.6),
        inset 10px 10px 10px rgba(0, 0, 0, 0.25);
      transition: background-color 0.25s;
    }

    .switch-toggle input[type="checkbox"] + label::before {
      position: absolute;
      content: "OFF";
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      line-height: 24px;
      top: 7px;
      left: 7px;
      width: 42px;
      height: 24px;
      border-radius: 20px;
      background-color: #eeeeee;
      color: #616161;
      box-shadow: 
        -3px -3px 5px rgba(255, 255, 255, 0.5),
        3px 3px 5px rgba(0, 0, 0, 0.25);
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .switch-toggle input[type="checkbox"]:checked + label::before {
      left: 47px;
      content: "ON";
      color: #ffffff;
      background-color: var(--accent-green);
      box-shadow: 
        -3px -3px 5px rgba(255, 255, 255, 0.5),
        3px 3px 6px var(--accent-green-glow);
    }

    /* Recessed Slider for Light Dimming */
    .slider-module {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 6px 6px;
      width: 100%;
    }

    .slider-track-wrap {
      flex: 1;
      position: relative;
      height: 12px;
      border-radius: 10px;
      box-shadow: 
        inset 3px 3px 6px rgba(0, 0, 0, 0.25),
        inset -3px -3px 6px rgba(255, 255, 255, 0.8);
      background: #e2e2e2;
    }

    .slider-input {
      -webkit-appearance: none;
      width: 100%;
      height: 100%;
      background: transparent;
      outline: none;
      margin: 0;
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
    }

    .slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #eeeeee;
      box-shadow: 
        -2px -2px 4px var(--shadow-light),
        2px 2px 5px rgba(0, 0, 0, 0.3);
      cursor: grab;
      border: 2px solid #ffffff;
      transition: transform 0.1s ease;
    }

    .slider-input:active::-webkit-slider-thumb {
      transform: scale(1.15);
      box-shadow: 0 0 8px var(--accent-green-glow);
    }

    .slider-val {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 34px;
      text-align: right;
    }

    /* Live Telemetry / MQTT Drawer Console */
    .telemetry-drawer {
      border-radius: 14px;
      background: #e1e1e1;
      padding: 10px 14px;
      box-shadow: 
        inset 4px 4px 8px rgba(0, 0, 0, 0.18),
        inset -4px -4px 8px rgba(255, 255, 255, 0.7);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .telemetry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .telemetry-log {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #333d47;
      background: rgba(255, 255, 255, 0.4);
      padding: 6px 8px;
      border-radius: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .telemetry-log .tag {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 4px;
      background: #3b414d;
      color: #fff;
    }

    /* Footer Stats */
    .footer-stats {
      display: flex;
      justify-content: space-around;
      padding-top: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>

  <!-- Floating Desktop Shell / Electron Window Simulation -->
  <div class="widget-window" id="deskWidget">

    <!-- Title Bar & Window Controls -->
    <div class="window-header">
      <div class="window-title">
        <i class="bi bi-grid-1x2-fill"></i>
        <span>Smart Desk Hub</span>
        <span class="mqtt-indicator">
          <span class="status-dot"></span> MQTT
        </span>
      </div>
      <div class="window-controls">
        <button class="win-btn" title="Pin to Top" id="pinBtn" onclick="togglePin()">
          <i class="bi bi-pin-angle"></i>
        </button>
        <button class="win-btn" title="Minimize" onclick="window.desk.minimize()">
          <i class="bi bi-dash"></i>
        </button>
        <button class="win-btn close" title="Close" onclick="window.desk.hide()">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <!-- Quick Preset Scenes -->
    <div class="scenes-container">
      <button class="scene-chip active" id="scene-work" onclick="applyScene('work')">
        <i class="bi bi-briefcase-fill"></i> Work
      </button>
      <button class="scene-chip" id="scene-meet" onclick="applyScene('meet')">
        <i class="bi bi-camera-video-fill"></i> Meet
      </button>
      <button class="scene-chip" id="scene-leave" onclick="applyScene('leave')">
        <i class="bi bi-moon-stars-fill"></i> Leave
      </button>
    </div>

    <!-- 1. Original Reference Style: Bluetooth Audio Link -->
    <div class="switch-holder is-on" id="card-bluetooth">
      <div class="switch-top-row">
        <div class="switch-label">
          <div class="icon-box">
            <i class="bi bi-bluetooth"></i>
          </div>
          <div class="switch-info">
            <span>Bluetooth</span>
            <span class="switch-subtext" id="bt-status">Audio Engine Connected</span>
          </div>
        </div>
        <div class="switch-toggle">
          <input type="checkbox" id="bluetooth" checked onchange="handleToggle('bluetooth', this, 'office/desk/soundbar')" />
          <label for="bluetooth"></label>
        </div>
      </div>
    </div>

    <!-- 2. Ambient Desk Light (With Integrated Neumorphic Recessed Brightness Slider) -->
    <div class="switch-holder is-on expanded" id="card-light">
      <div class="switch-top-row">
        <div class="switch-label">
          <div class="icon-box">
            <i class="bi bi-lightbulb-fill"></i>
          </div>
          <div class="switch-info">
            <span>Desk Halo LED</span>
            <span class="switch-subtext">Philips Hue ScreenBar</span>
          </div>
        </div>
        <div class="switch-toggle">
          <input type="checkbox" id="deskLight" checked onchange="handleToggle('light', this, 'office/desk/lights')" />
          <label for="deskLight"></label>
        </div>
      </div>
      <!-- Recessed Brightness Dimmer -->
      <div class="slider-module" id="lightBrightnessModule">
        <i class="bi bi-sun" style="font-size: 13px; color: var(--text-muted);"></i>
        <div class="slider-track-wrap">
          <input 
            type="range" 
            min="5" 
            max="100" 
            value="80" 
            class="slider-input" 
            id="lightSlider"
            oninput="handleSliderChange(this.value)"
          />
        </div>
        <span class="slider-val" id="sliderVal">80%</span>
      </div>
    </div>

    <!-- 3. Smart AC Plug / Workstation Rig -->
    <div class="switch-holder is-on" id="card-rig">
      <div class="switch-top-row">
        <div class="switch-label">
          <div class="icon-box">
            <i class="bi bi-outlet"></i>
          </div>
          <div class="switch-info">
            <span>Smart Plug</span>
            <span class="switch-subtext">Peripherals & Monitors</span>
          </div>
        </div>
        <div class="switch-toggle">
          <input type="checkbox" id="smartPlug" checked onchange="handleToggle('rig', this, 'office/desk/plug_main')" />
          <label for="smartPlug"></label>
        </div>
      </div>
    </div>

    <!-- 4. Privacy Guard (Mic & Cam Hardware Kill-Switch) -->
    <div class="switch-holder" id="card-privacy">
      <div class="switch-top-row">
        <div class="switch-label">
          <div class="icon-box">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <div class="switch-info">
            <span>Privacy Guard</span>
            <span class="switch-subtext">Mic & Webcam Shutter</span>
          </div>
        </div>
        <div class="switch-toggle">
          <input type="checkbox" id="privacySwitch" onchange="handleToggle('privacy', this, 'office/desk/privacy_guard')" />
          <label for="privacySwitch"></label>
        </div>
      </div>
    </div>

    <!-- Live Telemetry / MQTT Publisher Log -->
    <div class="telemetry-drawer">
      <div class="telemetry-header">
        <span><i class="bi bi-activity"></i> MQTT Bridge Console</span>
        <span id="pingMs">ping: 14ms</span>
      </div>
      <div class="telemetry-log" id="mqttLog">
        <span class="tag">PUB</span>
        <span id="mqttPayload">office/desk/status -> {"state":"READY"}</span>
      </div>
    </div>

    <!-- Quick Footer Sensors -->
    <div class="footer-stats">
      <div class="stat-item" title="Room Temperature">
        <i class="bi bi-thermometer-half"></i> 22.4°C
      </div>
      <div class="stat-item" title="Room Humidity">
        <i class="bi bi-droplet"></i> 48%
      </div>
      <div class="stat-item" title="Desk Power Draw">
        <i class="bi bi-lightning-charge"></i> <span id="powerDraw">142W</span>
      </div>
    </div>

  </div>

  <script>
    // Handle Toggle Interactions with visual feedback and simulated MQTT messages
    function handleToggle(type, checkbox, topic) {
      const isChecked = checkbox.checked;
      const card = document.getElementById(`card-${type}`);

      // Visual active class
      if (isChecked) {
        card.classList.add('is-on');
      } else {
        card.classList.remove('is-on');
      }

      // Dynamic sub-text updates
      if (type === 'bluetooth') {
        document.getElementById('bt-status').textContent = isChecked ? 'Audio Engine Connected' : 'Disconnected / Standby';
      }

      // Specific rule for Privacy guard: if ON, drop mic/cam
      if (type === 'privacy' && isChecked) {
        flashNotice('Privacy Mode Activated: Mic & Cam Cutoff');
      }

      // Dim light slider if lights are turned off
      if (type === 'light') {
        const sliderMod = document.getElementById('lightBrightnessModule');
        sliderMod.style.opacity = isChecked ? '1' : '0.4';
        sliderMod.style.pointerEvents = isChecked ? 'auto' : 'none';
      }

      // Publish Simulated MQTT Event
      const payload = {
        state: isChecked ? 'ON' : 'OFF',
        timestamp: new Date().toLocaleTimeString(),
        source: 'electron-desk-widget'
      };

      publishLog(topic, payload);
      recalcPower();
    }

    // Handle Brightness Slider Change
    let debounceTimer;
    function handleSliderChange(val) {
      document.getElementById('sliderVal').textContent = `${val}%`;
      
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        publishLog('office/desk/lights/dim', { brightness: parseInt(val, 10) });
      }, 150);
    }

    // Publish to Live Log View
    function publishLog(topic, data) {
      const logElement = document.getElementById('mqttPayload');
      logElement.innerHTML = `<strong>${topic}</strong> -> ${JSON.stringify(data)}`;
      
      // Ping flicker
      const pingElement = document.getElementById('pingMs');
      const randomPing = Math.floor(Math.random() * 8) + 11;
      pingElement.textContent = `ping: ${randomPing}ms`;
    }

    // Quick Scene Presets
    function applyScene(sceneName) {
      document.querySelectorAll('.scene-chip').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`scene-${sceneName}`).classList.add('active');

      const bt = document.getElementById('bluetooth');
      const light = document.getElementById('deskLight');
      const rig = document.getElementById('smartPlug');
      const privacy = document.getElementById('privacySwitch');
      const slider = document.getElementById('lightSlider');

      if (sceneName === 'work') {
        bt.checked = true;
        light.checked = true;
        rig.checked = true;
        privacy.checked = false;
        slider.value = 85;
      } else if (sceneName === 'meet') {
        bt.checked = true;
        light.checked = true;
        rig.checked = true;
        privacy.checked = false;
        slider.value = 100;
      } else if (sceneName === 'leave') {
        bt.checked = false;
        light.checked = false;
        rig.checked = false;
        privacy.checked = true;
        slider.value = 0;
      }

      // Trigger updates on all
      handleToggle('bluetooth', bt, 'office/desk/soundbar');
      handleToggle('light', light, 'office/desk/lights');
      handleToggle('rig', rig, 'office/desk/plug_main');
      handleToggle('privacy', privacy, 'office/desk/privacy_guard');
      handleSliderChange(slider.value);

      publishLog(`office/scenes/set`, { preset: sceneName.toUpperCase() });
    }

    // Dynamic Power calculation simulation
    function recalcPower() {
      let watts = 0;
      if (document.getElementById('bluetooth').checked) watts += 14;
      if (document.getElementById('smartPlug').checked) watts += 115;
      if (document.getElementById('deskLight').checked) {
        const bright = parseInt(document.getElementById('lightSlider').value, 10);
        watts += Math.round(18 * (bright / 100));
      }
      document.getElementById('powerDraw').textContent = `${watts}W`;
    }

    // Pin Toggle
    async function togglePin() {
      const isPinned = await window.desk.togglePin();
      flashNotice(isPinned ? 'Pinned on top' : 'Unpinned');
      const pinBtn = document.getElementById('pinBtn');
      if (isPinned) {
        pinBtn.style.color = '#00b33c';
        pinBtn.style.boxShadow = 'inset -2px -2px 4px var(--shadow-light), inset 2px 2px 4px var(--shadow-dark)';
      } else {
        pinBtn.style.color = 'var(--text-muted)';
        pinBtn.style.boxShadow = '-3px -3px 6px var(--shadow-light), 3px 3px 6px var(--shadow-dark)';
      }
    }

    // Simple toast notice inside the log
    function flashNotice(msg) {
      publishLog('system/widget/event', { notice: msg });
    }

    window.onload = function() {
      recalcPower();

      // Fit the Electron window height to the widget content
      const fit = () => window.desk.resize(document.body.scrollHeight);
      new ResizeObserver(fit).observe(document.getElementById('deskWidget'));
      fit();
    };
  </script>
</body>
</html>
